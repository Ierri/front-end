name: Deploy

on:
  workflow_call:
    inputs:
      target_environment:
        required: true
        type: string
      image_tag:
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: GHCR e Coolify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ inputs.target_environment }}
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
      SITE_URL: ${{ vars.SITE_URL }}
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Definir nome da imagem
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "IMAGE_NAME=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Validar URL pública da API
        run: |
          if [ -z "$NEXT_PUBLIC_API_URL" ]; then
            echo "::error::Configure NEXT_PUBLIC_API_URL em Settings > Environments > ${{ inputs.target_environment }} > Variables. O valor é necessário durante o build, não somente no Coolify."
            exit 1
          fi

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Construir imagem
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}
            ${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            SITE_URL=${{ vars.SITE_URL }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha,scope=${{ inputs.target_environment }}
          cache-to: type=gha,mode=max,scope=${{ inputs.target_environment }}

      - name: Verificar o container antes de publicar
        run: |
          docker run --detach --rm --name ierri-smoke --publish 127.0.0.1:3100:3000 "$IMAGE_NAME:$IMAGE_TAG"
          trap 'docker stop ierri-smoke >/dev/null 2>&1 || true' EXIT
          curl --fail --silent --show-error --retry 20 --retry-delay 1 --retry-all-errors --max-time 5 --output /dev/null http://127.0.0.1:3100/auth
          curl --fail --silent --show-error --max-time 5 --output /dev/null http://127.0.0.1:3100/favicon.ico
          curl --fail --silent --show-error --max-time 5 --output /dev/null http://127.0.0.1:3100/brand/ierri/logos/svg/ierri-symbol-primary.svg

      - name: Entrar no GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagem validada
        run: |
          docker push "$IMAGE_NAME:$IMAGE_TAG"
          docker push "$IMAGE_NAME:$IMAGE_TAG-$GITHUB_SHA"

      - name: Solicitar deploy ao Coolify
        if: vars.COOLIFY_DEPLOY_ENABLED == 'true'
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_DEPLOY_WEBHOOK: ${{ vars.COOLIFY_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$COOLIFY_TOKEN" ] || [ -z "$COOLIFY_DEPLOY_WEBHOOK" ]; then
            echo "::error::Configure COOLIFY_TOKEN e COOLIFY_DEPLOY_WEBHOOK antes de ativar o deploy."
            exit 1
          fi
          curl --fail --silent --show-error --connect-timeout 10 --max-time 60 \
            --request POST "$COOLIFY_DEPLOY_WEBHOOK" \
            --header "Accept: application/json" \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            --output "$RUNNER_TEMP/coolify-deploy.json"
          echo "Deploy solicitado ao Coolify. Confirme a conclusão no painel da aplicação."

      - name: Resumo
        env:
          DEPLOY_ENABLED: ${{ vars.COOLIFY_DEPLOY_ENABLED }}
        run: |
          echo "### Imagem publicada" >> "$GITHUB_STEP_SUMMARY"
          echo "- Imagem: \`$IMAGE_NAME:$IMAGE_TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Versão: \`$IMAGE_NAME:$IMAGE_TAG-$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$DEPLOY_ENABLED" != "true" ]; then
            echo "- Coolify desativado: configure o ambiente e habilite COOLIFY_DEPLOY_ENABLED." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Deploy solicitado. A aceitação do webhook não confirma que a aplicação já está saudável." >> "$GITHUB_STEP_SUMMARY"
          fi
