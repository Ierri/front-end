name: Deploy staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    if: github.ref == 'refs/heads/staging'
    needs: validate
    uses: ./.github/workflows/deploy.yml
    with:
      target_environment: staging
      image_tag: staging
    secrets: inherit
